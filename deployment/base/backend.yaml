# Backend (NestJS + Apollo GraphQL) Deployment + Service.
#
# Stateless: all durable state lives on the shared /uploads volume (uploads-pvc, RWX) and the
# SQLite metadata.db within it. Mounts the same PVC as the processing worker. Liveness/readiness
# probes hit the Terminus endpoints; readiness fails if /uploads is unreachable (Req 5.2, 10.5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  # Replica count is set per-overlay (dev=1, ha>=2). Default here is a safe single replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: video-platform/backend:dev
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: UPLOADS_DIR
              value: /uploads
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: uploads
              mountPath: /uploads
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
