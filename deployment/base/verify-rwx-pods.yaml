# Throwaway pods used only to verify concurrent ReadWriteMany mounting and
# durability of the uploads-pvc (HVC #4). Not part of the application; safe to
# delete after verification.
apiVersion: v1
kind: Pod
metadata:
  name: rwx-writer
  namespace: video-platform
  labels:
    app.kubernetes.io/name: rwx-verify
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: uploads
          mountPath: /uploads
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: uploads-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: rwx-reader
  namespace: video-platform
  labels:
    app.kubernetes.io/name: rwx-verify
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: uploads
          mountPath: /uploads
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: uploads-pvc
