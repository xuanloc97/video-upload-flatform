# Ingress for the monitoring stack. A separate Ingress object (in the monitoring namespace) that
# shares the same host as the app ingress; nginx-ingress merges rules across Ingresses for the same
# host. More specific prefixes (/grafana, /prometheus) win over the app's catch-all `/` rule.
#
#   http://localhost/grafana     -> Grafana   (served from sub-path)
#   http://localhost/prometheus  -> Prometheus (served under its route prefix)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: video-upload-platform
    app.kubernetes.io/component: monitoring
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
