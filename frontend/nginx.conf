# NGINX config for the static React SPA.
#
# The Ingress routes `/graphql`, `/health`, and `/files` to the backend Service, so this server only
# needs to serve the built SPA assets and provide history-API fallback (any unknown path returns
# index.html so client-side routing / deep links work).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
